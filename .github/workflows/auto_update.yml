name: Auto Update Movies & Series Catalog

on:
  schedule:
    # Run twice daily at 00:00 and 12:00 UTC (07:00 and 19:00 WIB)
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Scraper Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Incremental Catalog Updater
        run: |
          python scripts/update_latest.py --pages 3

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No changes in catalog."
          else
            git commit -m "chore(catalog): auto-update movies, series & stream sources"
            git push origin HEAD:main
          fi
